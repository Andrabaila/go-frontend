name: Docker Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'src/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'src/**'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build metadata
        id: meta
        run: |
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-frontend:latest
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_APP_DEPLOYED_AT=${{ steps.meta.outputs.built_at }}
            VITE_APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ya@100.113.39.97 "
            set -e
            image='${{ secrets.DOCKERHUB_USERNAME }}/go-frontend:latest'

            for attempt in 1 2 3; do
              if docker pull \"\$image\"; then
                break
              fi

              if [ \"\$attempt\" -eq 3 ]; then
                echo 'Failed to pull image after 3 attempts'
                exit 1
              fi

              echo \"Docker pull failed, retrying in 10 seconds...\"
              sleep 10
            done

            docker stop go-frontend || true
            docker rm go-frontend || true
            docker run -d \
              --env-file /home/ya/.env \
              --name go-frontend \
              --restart always \
              -p 80:80 \
              \"\$image\"
          "
